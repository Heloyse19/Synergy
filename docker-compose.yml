# Ambiente de DESENVOLVIMENTO.
#   Só o banco:                  docker compose up -d
#   Banco + next dev em Docker:  docker compose --profile dev up -d    (hot reload via bind mount)
#   Banco + imagem de produção:  docker compose --profile full up --build
# No dia a dia a aplicação roda no host com `npm run dev` (hot reload) apontando para localhost:3306;
# o perfil `dev` é a alternativa para rodar o mesmo `next dev` dentro de um container.
services:
  db:
    image: mysql:8.4
    container_name: synergy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: synergy
      MYSQL_USER: synergy
      MYSQL_PASSWORD: synergy
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Opcional: constrói a imagem de produção e sobe a aplicação junto do banco.
  app:
    build: .
    image: synergy:local
    profiles: ['full']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://synergy:synergy@db:3306/synergy
      SESSION_SECRET: ${SESSION_SECRET:-segredo-local-apenas-para-testes-com-32-caracteres}
      APP_URL: http://localhost:3000
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-true}
    ports:
      - '3000:3000'

  # Opcional: Next.js em modo dev (hot reload) dentro do container. O código do host é espelhado em
  # /app por bind mount; node_modules e .next ficam em volumes do Docker para não se misturarem com
  # os do host (binários nativos e cache do `next dev` são específicos de cada ambiente).
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: synergy:dev
    container_name: synergy-dev
    profiles: ['dev']
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tem precedência sobre o DATABASE_URL do .env (127.0.0.1): dentro da rede do Compose o host é `db`.
      DATABASE_URL: mysql://root:root@db:3306/synergy
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next

volumes:
  db_data:
  dev_node_modules:
  dev_next:
