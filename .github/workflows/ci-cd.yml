# Pipeline CI/CD do Synergy
# - quality: lint, tipos, testes e build em todo push/PR
# - docker:  publica a imagem no GitHub Container Registry (apenas na main)
# - deploy:  atualiza o servidor via SSH com docker compose (apenas na main, se os secrets existirem)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          # O build não acessa o banco, mas o Prisma Client e a sessão exigem as variáveis definidas.
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          SESSION_SECRET: segredo-apenas-para-o-build-no-ci-32-caracteres
          NEXT_TELEMETRY_DISABLED: 1

      - name: Configurar Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Validar Dockerfile (build sem push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    name: Publicar imagem no GHCR
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags latest + sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no servidor (Docker + Cloudflare Tunnel)
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # o servidor usa o GITHUB_TOKEN para fazer pull da imagem no GHCR
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Verificar secrets de deploy
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY não configurados; deploy ignorado."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar chave SSH
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Atualizar containers no servidor
        if: steps.check.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/synergy}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
          REMOTE

      - name: Verificar saúde da aplicação
        if: steps.check.outputs.configured == 'true' && vars.APP_URL != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.APP_URL }}/api/health"; then echo; echo "Aplicação saudável."; exit 0; fi
            echo "Aguardando aplicação subir ($i/12)..."; sleep 10
          done
          echo "::error::A aplicação não respondeu em ${{ vars.APP_URL }}/api/health"
          exit 1
